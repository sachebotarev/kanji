ru:
  language_tag: ru
  name: Кандзи дэс нэ
  title: Кандзи дэс нэ — японский начинается с черты
  description: Учите японские иероглифы и лексику на Android. Пишите от руки, собирайте свой словарь и следите за прогрессом.
  skip: К содержимому
  nav: Навигация
  features_link: Возможности
  privacy: Конфиденциальность
  privacy_path: /
  support: Написать разработчику
  platform: Для Android 7.0 и новее
  heading: Японский начинается с черты.
  intro: Знакомьтесь с кандзи, запоминайте слова и пишите от руки. В своём ритме, с понятными подсказками и котом, который всегда рядом.
  explore: Посмотреть возможности
  note: Без регистрации и рекламы
  example_label: Пример учебного материала
  example_reading: やま · yama
  example_meaning: гора
  example_caption: От знака к слову. От слова к практике.
  section_title: Всё складывается в знания.
  section_intro: Учебные материалы, личный словарь и рукописная практика — в одном приложении.
  features:
    - title: Пишите, а не только узнавайте
      text: Тренируйте кандзи пальцем или стилусом. Проверка оценивает форму, порядок черт и читаемость, а подсказки помогают разобраться в написании.
      sign: 書
      sign_meaning: Письмо
    - title: Собирайте свой японский
      text: Добавляйте в личный словарь слова, выражения и целые предложения. Сохраняйте чтения, переводы на разные языки и теги.
      sign: 語
      sign_meaning: Язык
    - title: Учитесь по своему рецепту
      text: Выберите материал из учебников, справочников или своего словаря. Сохраните настройки в рецепт и запускайте по нему тренировки.
      sign: 学
      sign_meaning: Учёба
  practice_title: Маленькие шаги. Заметный прогресс.
  steps:
    - title: Выберите материал
      text: Найдите нужные кандзи и слова по учебнику, главе или уровню JLPT.
    - title: Начните тренировку
      text: Пишите знаки, пользуйтесь подсказками и повторяйте сложное.
    - title: Посмотрите, как идёт учёба
      text: История тренировок, результаты заданий и календарь активности помогают видеть свой путь.
  offline_title: Учёба там, где вам удобно.
  offline_text: Учебный каталог и эталоны написания уже в приложении. Японская модель распознавания загружается через интернет; после загрузки рукописные знаки распознаются на устройстве.
  offline_note: Словарь, рецепты и история хранятся на устройстве. Диагностика ML Kit и системные резервные копии описаны в политике конфиденциальности.
  availability_title: До встречи в Google Play.
  availability_text: Приложение готовится к публичной публикации. Ссылка на установку появится на этой странице.
  contact_text: Есть вопрос или идея? Напишите разработчику.
  developer: Разработчик
  footer_note: Японский понемногу, каждый день.
en:
  language_tag: en
  name: Kanji Desu Ne
  title: Kanji Desu Ne — Japanese starts with a stroke
  description: Learn Japanese kanji and vocabulary on Android. Practise handwriting, build your vocabulary and follow your progress.
  skip: Skip to content
  nav: Navigation
  features_link: Features
  privacy: Privacy policy
  privacy_path: /privacy-policy.en.html
  support: Contact the developer
  platform: For Android 7.0 and later
  heading: Japanese starts with a stroke.
  intro: Discover kanji, learn words and write by hand. At your own pace, with helpful hints and a cat to keep you company.
  explore: Explore the features
  note: No account. No ads.
  example_label: Example study material
  example_reading: やま · yama
  example_meaning: mountain
  example_caption: From characters to words. From words to practice.
  section_title: Bring your learning together.
  section_intro: Study materials, a personal vocabulary and handwriting practice in one app.
  features:
    - title: Write it. Learn it.
      text: Practise kanji with your finger or a stylus. Checks assess shape, stroke order and legibility, while hints help you learn how to write each character.
      sign: 書
      sign_meaning: Writing
    - title: Make Japanese your own
      text: Add words, expressions and whole sentences to your personal vocabulary. Keep readings, translations in different languages and tags together.
      sign: 語
      sign_meaning: Language
    - title: Find your recipe for learning
      text: Choose material from textbooks, references or your vocabulary. Save your settings as a recipe, then use it to start training.
      sign: 学
      sign_meaning: Learning
  practice_title: Small steps. Progress you can see.
  steps:
    - title: Pick your material
      text: Find kanji and words by textbook, chapter or JLPT level.
    - title: Start practising
      text: Write characters, use hints and revisit the tricky ones.
    - title: See how you are doing
      text: Training history, task results and an activity calendar help you follow your progress.
  offline_title: Learn wherever you feel at home.
  offline_text: The study catalog and stroke references come with the app. The Japanese recognition model needs an internet download; once downloaded, handwriting recognition runs on your device.
  offline_note: Vocabulary, recipes and history are stored on your device. See the privacy policy for ML Kit diagnostics and system backups.
  availability_title: See you on Google Play.
  availability_text: The app is being prepared for public release. An installation link will appear on this page.
  contact_text: Have a question or an idea? Get in touch.
  developer: Developer
  footer_note: A little Japanese, every day.
